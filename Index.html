<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة سباق السيارات</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      font-family: Arial, sans-serif;
    }
    #game-container {
      position: relative;
      width: 300px;
      height: 500px;
      background-color: #555;
      border: 4px solid #fff;
      overflow: hidden;
    }
    /* خطوط الطريق */
    .line {
      position: absolute;
      width: 10px;
      height: 60px;
      background-color: white;
      left: 145px;
    }
    /* سيارة اللاعب */
    #player-car {
      position: absolute;
      bottom: 20px;
      left: 125px;
      width: 50px;
      height: 90px;
    }
    /* سيارات المنافسين */
    .enemy-car {
      position: absolute;
      width: 50px;
      height: 90px;
      top: -100px;
    }
    #score-board {
      margin-bottom: 10px;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div id="score-board">النقاط: <span id="score">0</span></div>

  <div id="game-container">
    <div class="line" style="top: 0px;"></div>
    <div class="line" style="top: 120px;"></div>
    <div class="line" style="top: 240px;"></div>
    <div class="line" style="top: 360px;"></div>
    
    <!-- سيارة اللاعب -->
    <img id="player-car" src="images/player.png" alt="لاعب">
  </div>

  <p>استخدم أسهم اللوحة (يمين / يسار) للتحكم بالسيارة</p>

  <!-- ربط ملف الـ JavaScript -->
  <script src="script.js"></script>
</body>
</html>
