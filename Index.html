<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة سباق السيارات</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      font-family: Arial, sans-serif;
    }
    #score-board {
      margin-bottom: 10px;
      font-size: 22px;
      font-weight: bold;
    }
    #game-container {
      position: relative;
      width: 320px;
      height: 500px;
      background-color: #333;
      border: 4px solid #fff;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }
    /* خطوط المنتصف المتحركة للطريق */
    .road-line {
      position: absolute;
      width: 8px;
      height: 60px;
      background-color: #fff;
      left: 156px;
    }
  </style>
</head>
<body>

  <div id="score-board">النقاط: <span id="score">0</span></div>

  <div id="game-container">
    <div class="road-line" style="top: -60px;"></div>
    <div class="road-line" style="top: 100px;"></div>
    <div class="road-line" style="top: 260px;"></div>
    <div class="road-line" style="top: 420px;"></div>
  </div>

  <p style="margin-top: 15px; font-size: 14px;">استخدم أزرار الأسهم يمين ويسار للتحكم بالحركة</p>

  <!-- ربط ملف الجافاسكريبت -->
  <script src="script.js"></script>
</body>
</html>
